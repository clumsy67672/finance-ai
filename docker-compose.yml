version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_ai
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - '5432:5432'
    volumes:
      - finance-ai-pg:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/finance_ai?schema=public
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - '4000:4000'
    env_file:
      - .env

volumes:
  finance-ai-pg:
    external: true
